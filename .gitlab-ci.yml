###################################################
#           GitLab CI/CD Pipeline
###################################################

stages:
  - check
  - test
  - docs

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

.install: &install
  - curl -LsSf https://astral.sh/uv/install.sh | sh
  - export PATH="$HOME/.local/bin:$PATH"
  - uv sync --extra dev --frozen

# stage 1: check 
sanity-check:
  stage: check
  image: python:3.12
  before_script:
    - *install
  script:
    - uv run python3 -c "import randquantkry; print('randquantkry imported ok, at', randquantkry.__file__)"
    - uv run python3 -c "from randquantkry.hamiltonian import build_hamiltonian; H = build_hamiltonian(2, [('X', 0, 1.0)]); print('build_hamiltonian smoke test ok:', H)"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "master"'

# Stage 2: test 
unit-tests:
  stage: test
  image: python:3.12
  before_script:
    - *install
  script:
    - uv run pytest tests/unit --cov=randquantkry --cov-report=term-missing --cov-report=xml --junitxml=test-results.xml
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    reports:
      junit: test-results.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - test-results.xml
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "master"'

# Stage 2b:  integration tests
integration-tests:
  stage: test
  image: python:3.12
  before_script:
    - *install
  script:
    - uv run pytest tests/integration --cov=randquantkry --cov-report=term-missing --cov-report=xml --junitxml=test-results.xml
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    reports:
      junit: test-results.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - test-results.xml
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "master"'


# Stage 3: build documentation 
pages:
  stage: docs
  image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim
  script:
    - uv sync --frozen
    - uv run mkdocs build -f docs/mkdocs.yml
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH