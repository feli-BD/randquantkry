[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "randquantkry"
version = "0.1.0"
description = "A RandNLA-accelerated Krylov subspace solver for quantum time evolution."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Felicia Erb", email = "felicia.erb@rwth-aachen.de" }
]

license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pandas>=3.0.3",
    "tabulate>=0.9.0",
    "seaborn>=0.13.2",
    "imageio-ffmpeg>=0.6.0",
    "psutil>=7.2.2",
    "qiskit>=1.0",
]

[project.optional-dependencies]
dev = ["build", "twine", "pytest>=7.0", "pytest-cov"]

[tool.setuptools]
packages = ["randquantkry", "randquantkry.utils"]

[tool.setuptools.package-dir]
randquantkry = "src"
"randquantkry.utils" = "utils"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
    "ruff>=0.16.2",
    "pytest>=7.0",
    "pytest-cov",
]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]