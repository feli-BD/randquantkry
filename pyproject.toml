[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rand_quantum_sim"
version = "0.1.0"
description = "A RandNLA-accelerated Krylov subspace solver for quantum time evolution."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "qiskit>=1.0",
    "build",
    "twine",
]

[tool.setuptools]
package-dir = {"" = "src", "utils" = "utils"}
packages = ["rand_quantum_sim", "utils"]